name: Feature request
description: Suggest an improvement to the tab, chords, exports or workflow
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What are you trying to do that's hard today?}
    validations: {required: true}
  - type: textarea
    id: idea
    attributes: {label: Proposed solution}
  - type: textarea
    id: alt
    attributes: {label: Alternatives considered}
